<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Actuator calculator embed preview</title>
  <style>
    :root { color-scheme: light; font: 14px/1.4 Arial, sans-serif; color: #2f373c; background: #f4f5f6; }
    body { margin: 0; padding: 24px; }
    h1 { margin: 0 0 12px; font-size: 20px; font-weight: 500; }
    .preview { width: min(700px, 100%); }
    label { display: grid; gap: 4px; color: #5f6870; font-size: 12px; }
    select, input { width: 100%; height: 32px; border: 1px solid #b9c0c5; background: #fff; padding: 4px 6px; font: inherit; color: #2f373c; }
    .frame-url { margin: 0 0 10px; }
    .sku-test { margin: 0 0 12px; }
    .frame-url input { font: 11px/1.2 Consolas, monospace; color: #49545b; }
    .frame-shell { border: 2px dashed #78909c; border-radius: 10px; padding: 6px; background: rgba(120, 144, 156, .06); }
    iframe { display: block; width: 700px; height: 900px; max-width: 100%; border: 1px solid #c8cdd1; border-radius: 4px; background: #fff; }
    p { color: #5f6870; margin: 10px 0 0; }
  </style>
</head>
<body>
  <div class="preview">
    <h1>Embedded actuator calculator preview</h1>
    <label class="sku-test">Test stock SKU<select id="skuSelect"><option value="">Choose a SKU…</option></select></label>
    <label class="frame-url">Injected iframe URL<input id="frameUrl" type="text" readonly></label>
    <div class="frame-shell">
      <iframe
        title="Linear actuator calculator"
        src="calc.html?v=20260921.3&actuator=cbeam-screw&motor=nema23-345-300&gantry=cbeam-large&travel=500&orientation=vertical&plateDirection=vertical&railWidth=80&load=5&components=0.5&offset=0&speed=2000&accel=100&microsteps=16&current=1.4&fos=2&embedPreview=7"
        width="700"
        height="900"
        loading="eager"></iframe>
    </div>
    <p>Target embed size: 700 × 680 px.</p>
  </div>
  <script>
    const frame = document.querySelector('iframe');
    const frameUrl = document.getElementById('frameUrl');
    const skuSelect = document.getElementById('skuSelect');
    fetch(`sku-source.json?v=${Date.now()}`, {cache: 'no-store'})
      .then(response => response.json())
      .then(source => Object.values(source.products || {}).forEach(product => skuSelect.add(new Option(`${product.sku} — ${product.displayName || 'No display name'}`, product.sku))))
      .catch(() => skuSelect.innerHTML = '<option value="">Unable to load SKU source</option>');
    skuSelect.addEventListener('change', () => {
      if (!skuSelect.value) return;
      frame.src = `calc.html?sku=${encodeURIComponent(skuSelect.value)}`;
    });
    const updateFrameUrl = () => {
      try { frameUrl.value = frame.contentWindow.location.href; }
      catch { frameUrl.value = frame.src; }
    };
    updateFrameUrl();
    frame.addEventListener('load', updateFrameUrl);
    setInterval(updateFrameUrl, 250);
  </script>
</body>
</html>
